<h1>疑似？擬似？</h1>

<p>学習指導要領＋解説には見当たりませんが、文科省は「擬似」で統一させているという情報をいただきました（擬似相関、擬似言語、擬似コードなど）。</p>

<p>なお、漢語としては「疑似」が正しく、「擬似」は日本で作られた語のようです。手もとの中国語辞典にも<span lang="zh">疑似</span> [yísì] はあるけれども<span lang="zh">擬似</span> (<span lang="zh">拟似</span>) は見当たりません。</p>

<p>参考: 漢字文化資料館 <a href="https://kanjibunka.com/kanji-faq/mean/q0426/">「擬似」と「疑似」の違いはありますか？</a></p>
