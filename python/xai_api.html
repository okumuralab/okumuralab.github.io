# xAIのAPIを使う

[2025-07-10] Grok 4が出たので全面的に書き換えた。

まずは `pip install --upgrade xai_sdk` でSDKをインストールまたは更新する。APIキーは環境変数に登録しておくのが便利（`export XAI_API_KEY="...."`）。それが難しい場合は、下の `Client()` のところを `Client(api_key=".....")` のようにしてAPIキーを設定する。

```python
from xai_sdk import Client
from xai_sdk.chat import system, user, assistant
from xai_sdk.search import SearchParameters

client = Client()
chat = client.chat.create(
    model="grok-4",
    search_parameters=SearchParameters(
        mode="auto",  # auto/on/off
        # from_date=datetime(2022, 1, 1),
        # to_date=datetime(2022, 12, 31),
        # max_search_results=10,
        return_citations=True
    ),
    temperature=0
)
# chat.append(system("（必要に応じてシステムプロンプトを指定）"))

prompt = r'''
（ここに質問を書く）
'''

chat.append(user(prompt.strip()))

response = chat.sample()
print(response.content)
print(response.citations)
```

さらに質問を続けるには、次のようにする。

```python
chat.append(assistant(response.content))

prompt = r'''
（ここに質問の続きを書く）
'''

chat.append(user(prompt.strip()))

response = chat.sample()
print(response.content)
print(response.citations)
```

これを延々と繰り返せばよい。
